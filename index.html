<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>拼豆图纸生成器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="control-panel">
        <div>
          <p class="eyebrow">Mard 221</p>
          <h1>拼豆图纸生成器</h1>
        </div>

        <label class="field">
          <span>上传图片</span>
          <input
            id="imageInput"
            type="file"
            accept=".jpg,.jpeg,.png,.bmp,.svg,image/jpeg,image/png,image/bmp,image/svg+xml"
          />
          <small>支持 JPG/JPEG、PNG、BMP、SVG。</small>
        </label>

        <div id="sourcePreview" class="source-preview hidden">
          <img id="sourcePreviewImage" alt="原图预览" />
          <div>
            <span>原图预览</span>
            <strong id="sourcePreviewText">未上传</strong>
          </div>
        </div>

        <div class="field-grid">
          <label class="field">
            <span>最大格子数</span>
            <input id="maxCellsInput" type="number" min="8" max="240" step="1" value="50" />
          </label>
          <label class="field">
            <span>最大颜色数</span>
            <input id="maxColorsInput" type="number" min="1" max="221" step="1" value="221" />
          </label>
        </div>

        <div class="field-grid">
          <label class="field">
            <span>采样方式</span>
            <select id="sampleMode">
              <option value="average" selected>区域平均</option>
              <option value="center">中心取色</option>
              <option value="dominant">主色采样</option>
            </select>
            <small id="sampleModeHelp">区域平均：整体最稳，适合照片和渐变图，推荐默认使用。</small>
          </label>
        </div>

        <div class="result-box">
          <span>最终图纸尺寸</span>
          <strong id="gridSizeText">请先上传图片</strong>
        </div>

        <div class="actions">
          <button id="generateBtn" class="primary" disabled>生成图纸</button>
          <button id="resetBtn" type="button" disabled>取消/重新编辑</button>
        </div>

        <p id="statusText" class="status">
          每个格子会直接匹配最接近的 4 个 Mard 色：第 1 个用于生成图纸，后 3 个用于编辑替换。
        </p>

      </section>

      <section class="preview-panel">
        <div class="preview-toolbar">
          <div>
            <h2>图纸预览</h2>
            <p id="summaryText">上传图片后会在这里生成带网格和图例的预览图。</p>
          </div>
          <div class="preview-actions">
            <label class="zoom-control">
              <span>预览缩放</span>
              <select id="previewZoom">
                <option value="fit" selected>适应窗口</option>
                <option value="0.3">30%</option>
                <option value="0.5">50%</option>
                <option value="0.8">80%</option>
                <option value="1">100%</option>
                <option value="1.2">120%</option>
              </select>
            </label>
            <button id="exportBtn" disabled>导出高清图片</button>
          </div>
        </div>
        <div id="cellEditor" class="cell-editor preview-editor hidden">
          <div>
            <span class="editor-label">当前格子</span>
            <strong id="selectedCellText">未选择</strong>
          </div>
          <div id="replacementOptions" class="replacement-options"></div>
        </div>
        <div class="canvas-wrap fit-preview">
          <canvas id="patternCanvas"></canvas>
          <div id="emptyState" class="empty-state">等待图片</div>
        </div>
      </section>
    </main>

    <script src="mard221-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
